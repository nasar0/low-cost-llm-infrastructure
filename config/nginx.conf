events {
    worker_connections 1024;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;

    # 1. FinOps / Seguridad: Definir zona de Rate Limiting por IP para usuarios anónimos
    # Permite un máximo de 2 peticiones por minuto (2r/m)
    limit_req_zone $binary_remote_addr zone=anon_limit:10m rate=2r/m;
    limit_req_status 429; # Código de error: Too Many Requests

    server {
        listen 80;
        server_name localhost;

        # Tamaño máximo de payload global (evita inyecciones masivas de texto)
        client_max_body_size 10m;

        # 2. Seguridad Perimetral: Proteger el endpoint donde se envían los mensajes de chat
        location /api/v1/chat/completions {
            
            # Lógica en Lua para validar si el usuario está logueado o es anónimo
            access_by_lua_block {
                local h = ngx.req.get_headers()
                local cookie = h["Cookie"] or ""
                local auth = h["Authorization"] or ""
                
                -- Buscamos si existe un token JWT o cookie de sesión de Open WebUI
                local is_authenticated = string.find(auth, "Bearer") or string.find(cookie, "token=")

                if not is_authenticated then
                    -- === TRATAMIENTO PARA USUARIOS ANÓNIMOS ===
                    
                    # A) Aplicar la restricción de máximo 2 peticiones (Rate Limiting)
                    -- Forzamos a Nginx a ejecutar el módulo de limit_req para esta IP
                    local res = ngx.location.capture("/_limit_anonymous")
                    if res.status == 429 then
                        ngx.status = 429
                        ngx.say('{"error": "LIMITADO: Solo puedes hacer 2 preguntas. Inicia sesión para acceso ilimitado."}')
                        return ngx.exit(429)
                    end

                    # B) Validar longitud de la pregunta (Máximo 20 caracteres)
                    ngx.req.read_body()
                    local body = ngx.req.get_body_data()
                    
                    if body then
                        -- Buscamos el texto dentro del JSON estándar de la petición (content)
                        -- Ejemplo: "content":"¿Hola cómo estás?"
                        local message_content = string.match(body, '"content"%s*:%s*"([^"]+)"')
                        
                        if message_content and string.len(message_content) > 20 then
                            ngx.status = 403
                            ngx.header.content_type = "application/json"
                            ngx.say('{"error": "RESTRICCIÓN: Tu pregunta no puede superar los 20 caracteres. Por favor, inicia sesión."}')
                            return ngx.exit(403)
                        end
                    end
                end
            }

            # Si pasa las reglas de seguridad, se envía al frontend
            proxy_pass http://open-webui:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Ubicación interna oculta para procesar el Rate Limit de los anónimos
        location /_limit_anonymous {
            internal;
            limit_req zone=anon_limit burst=1 nodelay;
            return 200;
        }

        #Acceso General: Interfaz Web, Login, Registro y Assets Estáticos
        location / {
            proxy_pass http://open-webui:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Soporte para WebSockets (Necesario para que Open WebUI responda en tiempo real fluído)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }
    }
}